name: Setup Environment
description: Common setup for lint and test jobs
inputs:
  python-version:
    description: Python version to use
    default: '3.10'
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'

    - name: Cache hatch environments
      uses: actions/cache@v5
      with:
        path: ~/.local/share/hatch/env
        key: ${{ runner.os }}-hatch-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-hatch-

    - name: Install hatch
      shell: bash
      run: |
        pip install --upgrade pip
        pip install hatch
