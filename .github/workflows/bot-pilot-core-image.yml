name: BotPilot Core Image CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - 'bot-pilot-chat/backend/bot-pilot-core-bom/**'
      - 'bot-pilot-chat/backend/bot-pilot-core-parent/**'
      - 'bot-pilot-chat/backend/Containerfile'
      - '.github/workflows/bot-pilot-core-image.yml'

jobs:
  build-and-push:
    if: ${{github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'}}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to docker.io
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push bot-pilot-core container image
        uses: docker/build-push-action@v6
        with:
          context: bot-pilot-chat/backend
          file: bot-pilot-chat/backend/Containerfile
          push: true
          tags: docker.io/normanboettcher/bot-pilot:bot-pilot-core-latest
          cache-from: type=registry,ref=docker.io/normanboettcher/bot-pilot:bot-pilot-core-buildcache
          cache-to: type=registry,ref=docker.io/normanboettcher/bot-pilot:bot-pilot-core-buildcache,mode=max
