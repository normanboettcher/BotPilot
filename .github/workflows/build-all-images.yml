name: Build All Images

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  # ─── bot-pilot-actions ───────────────────────────────────────────────────────
  build-actions:
    name: Build bot-pilot-actions
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bot-pilot
        uses: actions/checkout@v5

      - name: Checkout bot-pilot-config
        uses: actions/checkout@v5
        with:
          repository: normanboettcher/bot-pilot-config
          token: ${{ secrets.BOT_PILOT_CONFIG_TOKEN }}
          path: bot-pilot-config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to docker.io
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push bot-pilot-actions image
        uses: docker/build-push-action@v6
        with:
          context: bot-pilot-chat/backend/rasa-actions
          file: bot-pilot-config/deployment/backend/actions/Containerfile
          push: true
          tags: docker.io/normanboettcher/bot-pilot:bot-pilot-actions-latest

  # ─── bot-pilot-core ──────────────────────────────────────────────────────────
  build-core:
    name: Build bot-pilot-core
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bot-pilot
        uses: actions/checkout@v5

      - name: Checkout bot-pilot-config
        uses: actions/checkout@v5
        with:
          repository: normanboettcher/bot-pilot-config
          token: ${{ secrets.BOT_PILOT_CONFIG_TOKEN }}
          path: bot-pilot-config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to docker.io
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push bot-pilot-core image
        uses: docker/build-push-action@v6
        with:
          context: bot-pilot-chat/backend
          file: bot-pilot-config/deployment/backend/core/Containerfile
          push: true
          tags: docker.io/normanboettcher/bot-pilot:bot-pilot-core-latest
          cache-from: type=registry,ref=docker.io/normanboettcher/bot-pilot:bot-pilot-core-buildcache
          cache-to: type=registry,ref=docker.io/normanboettcher/bot-pilot:bot-pilot-core-buildcache,mode=max

  # ─── bot-pilot-rasa-core ─────────────────────────────────────────────────────
  build-rasa-core:
    name: Build bot-pilot-rasa-core
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bot-pilot
        uses: actions/checkout@v5

      - name: Checkout bot-pilot-config
        uses: actions/checkout@v5
        with:
          repository: normanboettcher/bot-pilot-config
          token: ${{ secrets.BOT_PILOT_CONFIG_TOKEN }}
          path: bot-pilot-config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to docker.io
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push bot-pilot-rasa-core image
        uses: docker/build-push-action@v6
        with:
          context: bot-pilot-chat/backend/rasa-actions
          file: bot-pilot-config/deployment/backend/rasa/core/Containerfile
          push: true
          tags: docker.io/normanboettcher/bot-pilot:bot-pilot-rasa-core-latest

  # ─── frontend ────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bot-pilot
        uses: actions/checkout@v5

      - name: Checkout bot-pilot-config
        uses: actions/checkout@v5
        with:
          repository: normanboettcher/bot-pilot-config
          token: ${{ secrets.BOT_PILOT_CONFIG_TOKEN }}
          path: bot-pilot-config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to docker.io
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: bot-pilot-chat/frontend/
          file: bot-pilot-config/deployment/frontend/Containerfile
          push: true
          build-args: |
            MODE=development
          tags: docker.io/normanboettcher/bot-pilot:frontend-latest
