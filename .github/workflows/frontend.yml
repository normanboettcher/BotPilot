name: Frontend CI

on:
  push:
    paths:
      - "bot-pilot-chat/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    types: [ opened, synchronize ]
    branches:
      - "main"
    paths:
      - "bot-pilot-chat/frontend/**"

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bot-pilot-chat/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Run Unit Tests
        run: bun run test:unit

      - name: Build frontend
        run: bun run build
