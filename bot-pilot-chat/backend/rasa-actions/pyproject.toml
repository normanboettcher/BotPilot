[project]
version = "0.1.0"
name = "bot_pilot"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

# ---------------------------------------------------------------------------
# Hatch – environment definitions and scripts
# ---------------------------------------------------------------------------
# Install hatch itself: pip install hatch
# Run any script: hatch run <env>:<script> e.g. hatch run lint:check
# Run default env: hatch run <script> e.g. hatch run unit
# ---------------------------------------------------------------------------

# fmt env – only black, no rasa pins to conflict with
[tool.hatch.envs.fmt]
dependencies = ["black==24.4.2"]

[tool.hatch.envs.fmt.scripts]
run   = ["black src/ tests/unit integration_tests/"]
check = ["black --check src/ tests/unit integration_tests/"]

# lint env – only flake8
[tool.hatch.envs.lint]
dependencies = ["flake8==7.1.0"]

[tool.hatch.envs.lint.scripts]
run = [
    "flake8 src/",
    "flake8 tests/unit",
    "flake8 integration_tests/",
]

# test env – rasa + pytest; isolated so rasa's strict pins don't bleed into fmt/lint
[tool.hatch.envs.test]
dependencies = [
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "emoji==2.14.1",
    "rasa_sdk==3.6.2",
    "rasa==3.6.21",
    "markdown_strings==3.4.0",
]

[tool.hatch.envs.test.scripts]
unit     = ["python -m pytest tests/unit"]
coverage = ["python -m pytest tests/unit --cov=src --cov-report=term-missing --cov-report=html"]

# ---------------------------------------------------------------------------
# Integration-test env – uses the full requirements.txt
# ---------------------------------------------------------------------------
[tool.hatch.envs.integration]
dependencies = [
    "-r requirements.txt",
]

[tool.hatch.envs.integration.scripts]
test = ["python -m pytest integration_tests/"]

# ---------------------------------------------------------------------------
# Rasa NLU + story test env
# Kept separate because Rasa + SpaCy have heavy, slow-to-resolve deps.
# ---------------------------------------------------------------------------
[tool.hatch.envs.rasa]
dependencies = [
    "rasa==3.6.21",
    "spacy==3.7.4",
    "de_core_news_md @ https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.7.0/de_core_news_md-3.7.0.tar.gz",
]

[tool.hatch.envs.rasa.scripts]
nlu    = ["rasa test nlu --fail-on-prediction-errors"]
stories = [
    "rasa test core --fail-on-prediction-errors --stories tests/rasa/stories",
]
