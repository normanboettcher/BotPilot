spring.application.name=bot-pilot-google-calendar-connector

server.port=8082

# ============================================================
# Google OAuth2 client configuration
# client-id and client-secret come from the Google Cloud Console.
# In production these should be externalised (Vault, Kubernetes secrets, etc.).
# redirect-uri must match the URI registered in the Google Cloud Console exactly.
# ============================================================
bot-pilot.google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:replace-me-in-production}
bot-pilot.google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:replace-me-in-production}
bot-pilot.google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8082/oauth2/callback}

# ============================================================
# Spring Cloud Vault — AppRole authentication
# VAULT_ADDR env var provides the Vault server address.
# CONNECTORS_VAULT_APP_ROLE_ID env var provides the role-id.
# The secret-id is read from a file at /run/secrets/bot-connectors-secret-id
# (matches the Python config.get_secret_id() pattern: file-based, never env var value).
# ============================================================
spring.cloud.vault.uri=${VAULT_ADDR:http://localhost:8200}
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role-id=${CONNECTORS_VAULT_APP_ROLE_ID:}
spring.cloud.vault.app-role.secret-id-mechanism=FILE
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID_FILE:/run/secrets/bot-connectors-secret-id}
spring.cloud.vault.kv.enabled=false

# ============================================================
# Spring Cloud Vault — Database secrets engine
# Vault injects dynamic MySQL credentials for the role bot-connectors-calendar-role.
# These credentials are rotated automatically by Vault; Spring Cloud Vault
# refreshes them before the lease expires.
# ============================================================
spring.cloud.vault.database.enabled=true
spring.cloud.vault.database.role=bot-connectors-calendar-role
spring.cloud.vault.database.backend=database

# ============================================================
# MySQL DataSource
# Host/port/database name come from environment variables.
# Username and password are injected dynamically by Spring Cloud Vault above;
# they must NOT be hardcoded here.
# ============================================================
spring.datasource.url=jdbc:mysql://${CONNECTORS_DB_IP:localhost}:${CONNECTORS_DB_PORT:3306}/${CONNECTORS_DB_NAME:bot_connectors}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ddl-auto=validate: schema is pre-created; Hibernate validates entity mappings
# against the existing schema at startup but never modifies DDL.
# If you need to add a column, write a migration script — do NOT change this to create-drop.
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
