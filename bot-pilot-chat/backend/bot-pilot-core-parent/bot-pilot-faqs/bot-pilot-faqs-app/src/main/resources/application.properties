spring.application.name=bot-pilot-faqs

server.port=8081

# Similarity threshold — minimum cross-encoder score to return a match.
# Matches the Python default of 0.7. Tune per environment without recompiling.
bot-pilot.faqs.similarity-threshold=0.7

# Actuator: expose health and info endpoints for readiness checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# DJL model cache directory (optional — defaults to ~/.djl.ai/cache)
# Uncomment and set to a volume mount in containerised deployments:
# djl.cache.dir=/opt/djl-cache
