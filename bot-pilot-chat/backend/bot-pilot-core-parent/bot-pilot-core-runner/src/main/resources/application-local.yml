# ============================================================
# Profile: local — the DEFAULT profile (see spring.profiles.active
# in application.yml). Active whenever a developer runs the app on
# their own machine. Developers never run the `vault` CLI and never
# use AppRole locally.
#
# Authentication: USERPASS against the shared dev Vault (reached over
# Tailscale). Each developer has a personal Vault username/password
# issued once by the platform team. The app logs in directly with
# those credentials — no secret-id files, no CLI login step.
#
# SECRETS NEVER LIVE IN THIS FILE. Only env-var indirection:
#   VAULT_ADDR              -> Vault URI (already read in application.yml)
#   VAULT_USERPASS_USERNAME -> your personal Vault username
#   VAULT_USERPASS_PASSWORD -> your personal Vault password
#
# Equivalently, Spring's relaxed binding lets you skip this indirection
# and export the canonical names directly (useful in an IDE run config):
#   SPRING_CLOUD_VAULT_USERPASS_USERNAME
#   SPRING_CLOUD_VAULT_USERPASS_PASSWORD
#
# The placeholders below have NO defaults on purpose: if the env vars
# are unset the app fails fast at startup with a clear
# "Could not resolve placeholder" instead of silently trying to reach
# Vault with empty credentials.
# ============================================================
spring:
  cloud:
    vault:
      authentication: USERPASS
      userpass:
        username: ${VAULT_USERPASS_USERNAME}
        password: ${VAULT_USERPASS_PASSWORD}
        # userpass-path defaults to "userpass" — the mount the platform
        # team enables with `vault auth enable userpass`. Only set this
        # if userpass is mounted at a non-default path.
        # userpass-path: userpass
