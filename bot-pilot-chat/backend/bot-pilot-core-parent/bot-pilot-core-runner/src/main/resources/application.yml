spring:
  application:
    name: bot-pilot-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - "optional:vault://"
      - "optional:vault://secret/bot-pilot-core/${SPRING_PROFILES_ACTIVE:local}"
  cloud:
    vault:
      uri: ${VAULT_ADDR}
      authentication: APPROLE
      # ============================================================
      # Spring Cloud Vault — AppRole authentication
      # VAULT_ADDR env var provides the Vault server address.
      # ============================================================
      app-role:
        role-id: ${CORE_APP_ID}
        #secret-id-mechanism: FILE
        secret-id: ${CORE_SECRET_ID}
      kv:
        enabled: true
      # ============================================================
      # Spring Cloud Vault — Database secrets engine
      # Vault injects dynamic MariaDB credentials for the role bot-pilot-core-db-role.
      # These credentials are rotated automatically by Vault; Spring Cloud Vault
      # refreshes them before the lease expires.
      # ============================================================
      database:
        enabled: true
        role: bot-pilot-core-db-role
        backend: database
        username-property: spring.datasource.username
        password-property: spring.datasource.password
  # ============================================================
  # MariaDB DataSource
  # Host/port/database name come from environment variables.
  # Username and password are injected dynamically by Spring Cloud Vault above;
  # they must NOT be hardcoded here.
  # ============================================================
  datasource:
    url: jdbc:mariadb://${CORE_DB_HOST}:${CORE_DB_PORT:3306}/${CORE_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: org.mariadb.jdbc.Driver
  # ============================================================
  # Liquibase — schema migrations
  # FAIL-SAFE DEFAULT: disabled. Migrations never run from a developer machine.
  # They run only on deployed stages, where SPRING_PROFILES_ACTIVE=dev (set in
  # bot-pilot-config) activates application-dev.yml, which enables Liquibase and
  # documents its dedicated credentials (spring.liquibase.url/user/password from
  # Vault KV — separate from the dynamic runtime datasource credentials).
  # Deliberate local override for a throwaway local DB: SPRING_LIQUIBASE_ENABLED=true.
  # ============================================================
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
  # ============================================================
  # JPA / Hibernate
  # ddl-auto=validate: schema is created/evolved by Liquibase; Hibernate validates
  # entity mappings against the existing schema at startup but never modifies DDL.
  # If you need to add a column, write a Liquibase changeset — do NOT change this to create-drop.
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MariaDBDialect
    show-sql: false

server:
  port: 8081

# Similarity threshold — minimum cross-encoder score to return a match.
# Matches the Python default of 0.7. Tune per environment without recompiling.
bot-pilot:
  faqs:
    similarity-threshold: 0.7
  # ============================================================
  # Google OAuth2 client configuration
  # client-id and client-secret come from the Google Cloud Console.
  # In production these should be externalised (Vault, Kubernetes secrets, etc.).
  # redirect-uri must match the URI registered in the Google Cloud Console exactly.
  # ============================================================
  google:
    oauth:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:replace-me-in-production}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:replace-me-in-production}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8082/oauth2/callback}

# DJL model cache directory (optional — defaults to ~/.djl.ai/cache)
# Uncomment and set to a volume mount in containerised deployments:
# djl:
#   cache:
#     dir: /opt/djl-cache

# ============================================================
# Actuator
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
